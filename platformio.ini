; ESP32-S3 running in QEMU (esp32s3 machine, Espressif emulator).
; Console switched from USB-CDC to UART, see sdkconfig.qemu_knob.
; Uses the src/port/qemu port (QEMU virtual panel).
; PSRAM: QEMU emulates Octal via ssi_psram/is_octal, size set with -m in run_qemu.sh.
; IMPORTANT: run QEMU with -display sdl. With "-display none" the RGB panel
; transfer never completes, the guest spins in the driver's busy-wait and the
; LVGL mutex deadlocks, so app_main() never returns.
[env:qemu_knob]
platform = espressif32 @ 7.0.1
board = lilygo-t-display-s3
framework = espidf
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
monitor_speed = 115200

build_flags = 
    -DQEMU_TARGET
    -Wno-error=format
    -Wno-error=type-limits
